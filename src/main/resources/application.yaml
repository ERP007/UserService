server:
  port: ${SERVICE_PORT}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: UserService

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: "${RABBITMQ_VIRTUAL_HOST:/}"
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 500ms
        multiplier: 2
        max-interval: 3s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    connect-timeout: ${KEYCLOAK_ADMIN_CONNECT_TIMEOUT:3s}
    read-timeout: ${KEYCLOAK_ADMIN_READ_TIMEOUT:10s}

user-authority:
  rabbitmq:
    exchange: ${USER_AUTHORITY_EXCHANGE:erp.events}
    routing-key: ${USER_AUTHORITY_CHANGED_ROUTING_KEY:user.authority.changed.gateway}

outbox:
  relay:
    fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:1000}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:10}
springdoc:
  api-docs:
    path: /users/v3/api-docs
  swagger-ui:
    path: /users/swagger-ui.html

logging:
  level:
    com.fallguys.userservice.shared.infrastructure.client.KeycloakUserIdentityManager: DEBUG
